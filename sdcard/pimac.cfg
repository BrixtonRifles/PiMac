# PiMac settings (edited by the F12 menu)
machine=classic
ram_kb=4096
rom=
disk=
alt_is_command=1
# Serial ports over Ethernet: modem port = network modem (ATDT host[:port]),
# printer port = LocalTalk over UDP. modem_listen=PORT makes TCP connections
# to that port ring the modem (0 = off).
modem=1
modem_listen=0
localtalk=1
